name: Build and Push Docker image + Trigger Dokploy

on:
  push:
    branches:
      - smt-microservice

# Ajouter des permissions étendues
permissions:
  contents: read
  packages: write
  id-token: write
  # Ajouter ces permissions si nécessaire
  attestations: write
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/laravel-dokploy
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: supervisor.dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy webhook to redeploy
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK" ]; then
            echo "DOKPLOY_WEBHOOK not set. Add it to repository Secrets."
            exit 1
          fi
          echo "Triggering Dokploy webhook..."
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"ref":"latest","image":"ghcr.io/'"${{ github.repository_owner }}"'/laravel-dokploy:latest"}' \
            "$DOKPLOY_WEBHOOK"