# .github/workflows/build-and-deploy.yml
name: Build and Push Docker image + Trigger Dokploy

on:
  push:
    branches:
      - smt-microservice  # change to your branch if needed

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Option 1: Use the built-in GITHUB_TOKEN (recommended if repo permissions allow)
          password: ${{ secrets.GITHUB_TOKEN }}
          # Option 2: Or use a personal token if you stored GHCR_PAT in secrets:
          # password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/laravel-dokploy:latest
      - name: Trigger Dokploy webhook to redeploy
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK" ]; then
            echo "DOKPLOY_WEBHOOK not set. Add it to repository Secrets."
            exit 1
          fi
          echo "Triggering Dokploy webhook..."
          # payload includes ref and image (dokploy will use tag matching configured tag)
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"ref":"latest","image":"ghcr.io/'"${{ github.repository_owner }}"'/laravel-dokploy:latest"}' \
            "$DOKPLOY_WEBHOOK"
